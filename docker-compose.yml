services:
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      front:
        condition: service_healthy
      back:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/nginx-health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - edge
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-/api}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge
    init: true
    security_opt:
      - no-new-privileges:true

  back:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: "${MYSQL_USER:?Defina MYSQL_USER no .env}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Defina MYSQL_DATABASE no .env}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TTL: "${CACHE_TTL:-10}"
      CACHE_MAX: "${CACHE_MAX:-100}"
      THROTTLE_TTL: "${THROTTLE_TTL:-60000}"
      THROTTLE_LIMIT: "${THROTTLE_LIMIT:-50}"
      SECRET_KEY: "${SECRET_KEY:?Defina SECRET_KEY no .env}"
      EXPIRES_IN: "${EXPIRES_IN:-15m}"
      REFRESH_SECRET: "${REFRESH_SECRET:?Defina REFRESH_SECRET no .env}"
      REFRESH_EXPIRES_IN: "${REFRESH_EXPIRES_IN:-7d}"
      CORS_ORIGIN: "${APP_ORIGIN:?Defina APP_ORIGIN no .env}"
      DB_SYNCHRONIZE: "${DB_SYNCHRONIZE:-false}"
      TMDB_ACCESS_TOKEN: "${TMDB_ACCESS_TOKEN:-}"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      TMDB_LANGUAGE: "${TMDB_LANGUAGE:-pt-BR}"
      TMDB_PAGES: "${TMDB_PAGES:-3}"
      SEED_MOVIE_LIMIT: "${SEED_MOVIE_LIMIT:-50}"
      SEED_USER_COUNT: "${SEED_USER_COUNT:-15}"
      SEED_REVIEW_COUNT: "${SEED_REVIEW_COUNT:-100}"
      SEED_USER_PASSWORD: "${SEED_USER_PASSWORD:-Demo@123}"
    expose:
      - "3001"
    volumes:
      - uploads_data:/usr/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3001/api/v1/hello-world",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge
      - private
    init: true
    security_opt:
      - no-new-privileges:true

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_USER: "${MYSQL_USER:?Defina MYSQL_USER no .env}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Defina MYSQL_DATABASE no .env}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    driver: bridge
  private:
    driver: bridge
    internal: true

volumes:
  mysql_data:
  redis_data:
  uploads_data:
